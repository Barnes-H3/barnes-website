name: Build and deploy hareline

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC: refreshes hareline.ics and the saved copy from the sheet
  workflow_dispatch:        # "Run workflow" button for an immediate refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site from the Google Sheet
        run: node scripts/build.mjs
        env:
          RUNS_CSV_URL: ${{ vars.RUNS_CSV_URL }}
          VENUES_CSV_URL: ${{ vars.VENUES_CSV_URL }}
          ANNOUNCEMENTS_CSV_URL: ${{ vars.ANNOUNCEMENTS_CSV_URL }}
          SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
