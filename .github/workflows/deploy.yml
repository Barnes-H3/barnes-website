name: Build and deploy hareline

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC: refreshes hareline.ics and the saved copy from the sheet
  workflow_dispatch:        # "Run workflow" button for an immediate refresh

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site from the Google Sheet
        run: node scripts/build.mjs
        env:
          RUNS_CSV_URL: ${{ vars.RUNS_CSV_URL }}
          VENUES_CSV_URL: ${{ vars.VENUES_CSV_URL }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
